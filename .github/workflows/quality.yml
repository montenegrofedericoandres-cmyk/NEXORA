name: NEXORA quality checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexora-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prelaunch rejection cases
        run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py && python scripts/build_site.py && python scripts/check_packaging.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the HTTP verifier
        run: node --test tests/test_live.cjs
      - name: Install browser testing tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium for mobile viewport checks
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check mobile and desktop layouts
        run: node scripts/check_mobile.cjs
      - name: Validate Cloudflare upload without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.0 deploy --dry-run --outdir /tmp/nexora-worker-check
      - name: Verify the public main deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/verify_live.cjs
